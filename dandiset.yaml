description: 'Calcium imaging of neurons in mouse piriform cortex (PCx) under passive
  odor stimulation or task-relevant odor stimulation (Go/NoGo). Subsets of neurons
  are are retrogradely-labeled to indicated their projection targets (one target per
  animal): olfactory bulb (OB) and medial prefrontal cortex (mPFC).'
